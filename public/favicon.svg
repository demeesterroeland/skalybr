<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: sky-600 to cyan-400 -->
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Blade metallic gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    
    <!-- Blade edge highlight -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Gold Guard / Pommel Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Hilt Grip Gradient -->
    <linearGradient id="gripGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="sparkleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Tile Base (rounded-2xl) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Sword Graphic centered and rotated -45 deg -->
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Blade tip to guard: blade runs upwards from y = -60 to y = -210 -->
    <!-- Blade Left Half -->
    <path d="M 0,-215 L -22,-175 L -20,-60 L 0,-60 Z" fill="url(#edgeGrad)"/>
    <!-- Blade Right Half (shaded) -->
    <path d="M 0,-215 L 22,-175 L 20,-60 L 0,-60 Z" fill="url(#bladeGrad)"/>
    <!-- Blade Center Ridge Highlight -->
    <line x1="0" y1="-215" x2="0" y2="-60" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Crossguard -->
    <rect x="-65" y="-60" width="130" height="22" rx="7" fill="url(#goldGrad)" stroke="#713f12" stroke-width="2"/>
    <!-- Guard Center Gem / Boss -->
    <circle cx="0" cy="-49" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Grip (Handle) -->
    <rect x="-11" y="-38" width="22" height="72" rx="4" fill="url(#gripGrad)" stroke="#292524" stroke-width="1.5"/>
    <!-- Wire wraps on grip -->
    <line x1="-11" y1="-22" x2="11" y2="-22" stroke="#ca8a04" stroke-width="2"/>
    <line x1="-11" y1="-6" x2="11" y2="-6" stroke="#ca8a04" stroke-width="2"/>
    <line x1="-11" y1="10" x2="11" y2="10" stroke="#ca8a04" stroke-width="2"/>
    <line x1="-11" y1="26" x2="11" y2="26" stroke="#ca8a04" stroke-width="2"/>

    <!-- Pommel (Base) -->
    <circle cx="0" cy="46" r="16" fill="url(#goldGrad)" stroke="#713f12" stroke-width="2"/>
    <circle cx="0" cy="46" r="6" fill="#ca8a04"/>
  </g>

  <!-- Sparkles -->
  <!-- Top-left sparkle -->
  <path d="M 125,185 Q 125,205 105,205 Q 125,205 125,225 Q 125,205 145,205 Q 125,205 125,185 Z" fill="#ffffff" filter="url(#sparkleGlow)"/>
  <!-- Middle-right sparkle -->
  <path d="M 395,225 Q 395,240 380,240 Q 395,240 395,255 Q 395,240 410,240 Q 395,240 395,225 Z" fill="#ffffff" filter="url(#sparkleGlow)"/>
  <!-- Lower sparkle dot -->
  <circle cx="160" cy="285" r="5" fill="#ffffff" opacity="0.9"/>
  <!-- Small upper sparkle dot -->
  <circle cx="335" cy="115" r="6" fill="#ffffff" opacity="0.95"/>
</svg>